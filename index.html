<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D18A8">
<title>Rondines de vigilancia · Zubex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--az:#0D18A8;--ac:#227EF6;--bg:#f8fafc;--azl:#dbeafe;--ok:#166534;--mal:#991b1b;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Poppins','Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-weight:400;-webkit-tap-highlight-color:transparent}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
.mu{color:var(--mu)}
.sm{font-size:13px}
.mt{margin-top:14px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row>.btn{flex:1}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1180px}
.wrap.narrow{max-width:420px;padding-top:28px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px}
.card+.card{margin-top:12px}
.top{background:var(--az);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.top .tt{flex:1;font-weight:600;font-size:15px}
.top img{height:54px;width:auto}
.logo{font-weight:700;letter-spacing:.16em;font-size:20px}
.top .btn{min-height:36px;padding:6px 12px;font-size:13px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:600 16px 'Poppins','Segoe UI',sans-serif;background:var(--az);color:#fff;cursor:pointer;min-height:52px}
.btn.sec{background:#fff;color:var(--az);border:2px solid var(--az)}
.top .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn.bad{background:var(--mal)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-act]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--ln);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
input[type=checkbox],input[type=radio]{width:auto}
.chip{display:inline-block;background:var(--azl);color:var(--az);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.chip.now{background:var(--az);color:#fff}
.banner{background:var(--azl);color:var(--az);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
.rcard h2{margin-bottom:4px}
.rcard .btn{margin-top:12px}

/* Rondín en curso */
.rh{position:sticky;top:0;z-index:5;background:var(--az);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.rh .row{align-items:flex-end;justify-content:space-between}
.crono{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;line-height:1.1}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.next{margin:6px 0 14px;padding:18px;border-radius:16px;background:#fff;border:2px solid var(--az);display:flex;gap:16px;align-items:center}
.next.fin{border-color:var(--ok)}
.ring{width:58px;height:58px;border-radius:50%;background:var(--azl);display:grid;place-items:center;flex:none;position:relative;color:var(--az)}
.ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--ac);animation:ping 1.8s ease-out infinite}
.next.fin .ring{background:#dcfce7;color:var(--ok)}
.next.fin .ring::after{display:none}
@keyframes ping{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tl{padding:4px 0 100px}
.stop{position:relative;display:flex;gap:14px;align-items:center;min-height:56px;padding:6px 0;cursor:default}
.stop[data-act]{cursor:pointer}
.stop::before{content:'';position:absolute;left:11px;top:-50%;height:100%;width:3px;background:#cbd5e1}
.stop:first-child::before{display:none}
.stop.done::before{background:var(--az)}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid #94a3b8;background:#fff;flex:none;position:relative;z-index:1;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.stop.done .dot{background:var(--az);border-color:var(--az)}
.stop.hall .dot{background:var(--mal);border-color:var(--mal)}
.stop.nx .dot{border-color:var(--ac);box-shadow:0 0 0 6px var(--azl)}
.stop .nm{flex:1;font-size:15px;font-weight:600}
.stop.pend .nm{font-weight:400;color:#334155}
.stop.nx .nm{font-weight:700;color:var(--az)}
.stop .tm{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.fx{font-size:11px;font-weight:600;color:var(--az);background:var(--azl);border-radius:6px;padding:2px 6px;margin-left:4px;white-space:nowrap}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6}
.bottom .btn{max-width:528px;margin:0 auto}

/* Hoja de captura */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow:auto}
.okmark{width:46px;height:46px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:10px}
.okmark.big{width:64px;height:64px;font-size:34px;margin:0 auto 12px}
.okmark.alt{background:var(--az)}
.warn{background:var(--azl);color:var(--az);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}
.warn.bad{background:#fef2f2;color:var(--mal)}
.cd{height:4px;background:var(--azl);border-radius:9px;overflow:hidden;margin-top:14px}
.cd i{display:block;height:100%;background:var(--ac);animation:cd 3.5s linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.tipo{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--ln);border-radius:12px;margin:8px 0 0;font-size:15px}
.tipo input{width:22px;height:22px;flex:none}
.tipo:has(input:checked){border-color:var(--mal);background:#fef2f2}
.kv2{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln);font-size:15px}
.kv2 b{font-variant-numeric:tabular-nums}

/* Supervisión */
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--ln);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 16px;font:600 14px 'Poppins','Segoe UI',sans-serif;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--az);border-color:var(--az)}
.fb{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.fb>div{min-width:140px}
.fb label{margin:0 0 4px}
.fb input,.fb select{padding:8px 10px;font-size:14px}
.fb .btn{min-height:38px;padding:8px 16px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.kl{font-size:12px;color:var(--mu);font-weight:600}
.kv{font-size:32px;font-weight:700;color:var(--az);line-height:1.2}
.kd{font-size:12px;font-weight:600;margin-top:2px}
.kd.pos{color:var(--ok)}.kd.neg{color:var(--mal)}.kd.neu{color:var(--az)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:16px}
.chart{position:relative;height:290px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--az);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
td input{padding:6px 8px;font-size:13px;border-radius:6px}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--azl)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.c{background:#dcfce7;color:var(--ok)}
.pill.i{background:#fef2f2;color:var(--mal)}
.pill.e{background:var(--azl);color:var(--az)}
.note{font-size:12px;color:var(--mu);margin:16px 0 8px;line-height:1.6}
.foot{background:var(--bg);color:var(--mu);font-size:12px;padding:12px 0 24px;text-align:center}
.sub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sub button{border:2px solid var(--ln);background:#fff;border-radius:999px;padding:6px 16px;font:600 13px 'Poppins','Segoe UI',sans-serif;cursor:pointer;color:var(--mu)}
.sub button.on{border-color:var(--az);color:var(--az);background:var(--azl)}
.seq{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}
.seq .n{width:26px;color:var(--mu);font-variant-numeric:tabular-nums}
.seq .nm{flex:1}
.dg{display:flex;gap:10px;flex-wrap:wrap}
.dg label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mo{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:16px;padding:20px;max-width:780px;width:100%;max-height:90vh;overflow:auto}
.md .row{margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.bad{background:var(--mal)}

/* Plano y monitor */
.mon{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;align-items:start}
.mon-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.maphost{position:relative;background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;height:calc(100vh - 230px);min-height:430px;touch-action:none}
.maphost svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.maphost svg.drag{cursor:grabbing}
.maphost.placing svg{cursor:crosshair}
.mz{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.mz .btn{width:42px;height:42px;min-height:42px;padding:0;font-size:20px;border-radius:10px;background:#fff;color:var(--az);border:2px solid var(--az)}
.mtip{position:absolute;left:12px;top:12px;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13px;max-width:min(360px,70%);box-shadow:0 4px 14px rgba(15,23,42,.15)}
.mk{cursor:pointer}
.mk .pul{animation:mpulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mpulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.mtx{text-anchor:middle;dominant-baseline:central;font-weight:700;pointer-events:none;font-family:'Poppins','Segoe UI',sans-serif}
.mn{text-anchor:middle;font-weight:600;fill:#0f172a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-family:'Poppins','Segoe UI',sans-serif}
.pin{pointer-events:none}
.etq{font-family:'Poppins','Segoe UI',sans-serif;font-weight:600;fill:#0D18A8;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:12px;color:var(--mu)}
.lgd{width:12px;height:12px;border-radius:50%;display:inline-block;box-sizing:border-box}
.als{display:flex;flex-direction:column;gap:6px}
.al{border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.al[data-act]{cursor:pointer}
.al.bad{background:#fef2f2;color:var(--mal)}
.al.info{background:var(--azl);color:var(--az)}
.al.ok{background:#dcfce7;color:var(--ok)}
.rc2{padding:10px 12px;border:2px solid var(--ln);border-radius:12px;background:#fff;cursor:pointer;margin-bottom:8px;font-size:14px}
.rc2.on{border-color:var(--az)}
.pg{height:6px;background:var(--azl);border-radius:9px;overflow:hidden;margin-top:6px}
.pg i{display:block;height:100%;background:var(--az)}
.pill.g{background:#e2e8f0;color:#475569}
.gmo{position:fixed;inset:0;background:#fff;z-index:25;display:flex;flex-direction:column}
.gmh{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--az);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.gmo .maphost{flex:1;height:auto;min-height:0;border:0;border-radius:0}
.gmf{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);font-size:13px;color:var(--mu);border-top:1px solid var(--ln)}
@media (max-width:980px){.mon{grid-template-columns:1fr}.maphost{height:62vh}}
@media (max-width:520px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.tabs,.fb,.btn,#toast{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
'use strict';
/* =====================================================================
   CONFIGURACIÓN
   - Pega aquí la config de tu proyecto Firebase (Realtime Database).
     Si databaseURL queda vacío, la app corre en MODO LOCAL de prueba
     (los datos viven solo en este navegador).
   - LOGO_SRC: ruta/URL del logotipo oficial Zubex (blanco sobre azul).
   ===================================================================== */
const FIREBASE_CONFIG = { apiKey:'', authDomain:'', databaseURL:'', projectId:'', appId:'' };
const LOGO_SRC = '';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dur = ms => { const s = Math.max(0, Math.round(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const arr = v => v ? (Array.isArray(v) ? v.filter(x => x != null) : Object.values(v)) : [];
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => { const r = [], d = new Date(a + 'T00:00:00'), e = new Date(b + 'T00:00:00'); while (d <= e) { r.push(dstr(d)); d.setDate(d.getDate() + 1); } return r; };
const clean = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
const TIPOS = { riesgo:'Riesgo detectado', AI:'Acto inseguro (AI)', CI:'Condición insegura (CI)' };
const ESTADOS = { en_curso:'En curso', completo:'Completo', incompleto:'Incompleto' };
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const NFC = 'NDEFReader' in window;
const NFCSVG = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8.5a5.5 5.5 0 0 1 0 7"/><path d="M10 6a9 9 0 0 1 0 12"/><path d="M14 3.5a12.5 12.5 0 0 1 0 17"/></svg>';

async function hashPin(p) {
  const t = 'zx-rondines|' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const c of t) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h; }
}

/* ---------- Base de datos: Firebase RTDB o modo local ---------- */
const DB = (() => {
  if (FIREBASE_CONFIG.databaseURL) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    return {
      mode:'firebase',
      get: p => db.ref(p).once('value').then(s => s.val()),
      set: (p, v) => db.ref(p).set(clean(v)),
      update: (p, v) => db.ref(p).update(clean(v)),
      remove: p => db.ref(p).remove(),
      watch: (p, cb) => { const r = db.ref(p), f = s => cb(s.val()); r.on('value', f); return () => r.off('value', f); }
    };
  }
  const K = 'rz_localdb';
  let data = {};
  const load = () => { try { data = JSON.parse(localStorage.getItem(K) || '{}'); } catch (e) { data = {}; } };
  const parts = p => p.split('/').filter(Boolean);
  const getp = p => parts(p).reduce((o, k) => o == null ? undefined : o[k], data);
  const setp = (p, v) => {
    const a = parts(p); let o = data;
    a.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    if (v === null || v === undefined) delete o[a[a.length - 1]]; else o[a[a.length - 1]] = v;
  };
  const save = () => localStorage.setItem(K, JSON.stringify(data));
  return {
    mode:'local',
    get: async p => { load(); return clean(getp(p)); },
    set: async (p, v) => { load(); setp(p, clean(v)); save(); },
    update: async (p, v) => { load(); Object.keys(v).forEach(k => setp(p + '/' + k, clean(v[k]))); save(); },
    remove: async p => { load(); setp(p, null); save(); },
    watch: (p, cb) => { let last = ''; const run = () => { load(); const v = clean(getp(p)), s = JSON.stringify(v); if (s !== last) { last = s; cb(v); } }; run(); const i = setInterval(run, 2500); return () => clearInterval(i); }
  };
})();

/* ---------- Estado ---------- */
const S = { view:'loading', user:null, puntos:{}, rutas:{}, usuarios:{}, cfg:{}, active:null, pending:null, sheet:null,
  rond:{}, tab:'monitor', ctab:'puntos', rid:null, draft:null, nfcOn:false, tm:null, lastClosed:null,
  mon:{ mode:'vivo', sel:null, upto:null, place:null, areas:false, fit:true, timer:null }, mapVB:null, gmap:false, unwatch:null, tick:null, watchDay:null,
  f:{ desde:addDays(dstr(), -13), hasta:dstr(), ruta:'', vig:'', estado:'', tipo:'', aten:'abierto' } };

/* ---------- Datos iniciales (de tu Excel: pestañas Mapeo, Secuencia y Frecuencia) ---------- */
const PN = ['Embarques 1','Almacén de residuos peligrosos','Taller de mantenimiento','Corrugado','Cuarto eléctrico','Impresora 9','Impresora 11','Cuarto de tintas 2','Cuarto máquina UPRINT','Conversión 1','Conversión 2','Almacén producto en proceso 1','Almacén materias primas','Extruder Cast','Oficinas de Calidad','Oficina de programación','Cuarto de grabados','Impresoras 4 y 5','Almacén producto en proceso 2','Laboratorio de calidad Extruder','Extruder línea 2','Exterior de extruder, pasillo perimetral','Baños hombres','Lockers hombres','Taller de proyectos','Predio 373 cuartos','Predio 373 área de motos 2','Acceso E3','Acceso E2','Planta de emergencia','Cuarto compresores E1','Acceso E1'];
const pidOf = n => 'P' + pad(n);
const rtok = () => Math.random().toString(36).slice(2, 8);
async function seed() {
  const puntos = {};
  PN.forEach((n, i) => puntos[pidOf(i + 1)] = { id:pidOf(i + 1), nombre:n, token:rtok() });
  const seq = (a, b) => Array.from({ length:b - a + 1 }, (_, i) => pidOf(a + i));
  const base = { dias:'0,1,2,3,4,5,6', intervalo:2, orden:'avisar' };
  const rutas = {

    ms:(r.fin || Date.now()) - r.inicio, pct:esp.length ? Math.round(done / esp.length * 100) : 0 };
}

/* ---------- Rondín: inicio, lectura, hallazgo, cierre ---------- */
function startRondin(rutaId) {
  const r = S.rutas[rutaId]; if (!r) return;
  const esp = arr(r.puntos).filter(p => S.puntos[p]);
  const nombres = {}; Object.values(S.puntos).forEach(p => nombres[p.id] = p.nombre);
  S.active = { id:uid(), rutaId, rutaNombre:r.nombre, nomina:S.user.nomina, nombre:S.user.nombre, fecha:dstr(), inicio:Date.now(),
    estado:'en_curso', esperados:esp, nombres, orden:r.orden || 'avisar', durMin:r.durMin || 0, durMax:r.durMax || 0, intervalo:r.intervalo || 0, lecturas:{} };
  saveActive(); syncActive(); const pend = S.pending; S.pending = null; S.view = pend ? 'punto' : 'round'; render(); wake();
  if (pend) handleScan(pend.pid, pend.k);
}
function handleScan(pid, k, manual = false, motivo = '') {
  const p = S.puntos[pid];
  if (!p) { toast('Etiqueta desconocida', 'bad'); return; }
  if (!manual && p.token !== k) { toast('Etiqueta no válida', 'bad'); return; }
  if (!S.user) { S.pending = { pid, k }; return; }
  if (!S.active) { S.pending = { pid, k }; S.view = 'punto'; render(); return; }
  const ron = S.active; ron.lecturas = ron.lecturas || {};
  let warn = '';
  if (!ron.lecturas[pid]) {
    const esp = arr(ron.esperados), next = nextPending(ron), enRuta = esp.includes(pid);
    const fuera = !enRuta || (ron.orden === 'avisar' && next !== pid);
    if (!enRuta) warn = 'Este punto no pertenece a la ruta de este rondín.';
    else if (fuera) warn = `Este no es el siguiente punto esperado. Siguiente: <b>${esc(ron.nombres[next] || '')}</b>. Puedes continuar.`;
    const lec = { ts:Date.now(), estado:'ok', fuera:!!fuera };
    if (manual) { lec.manual = true; lec.comentario = 'Registro manual: ' + motivo; }
    ron.lecturas[pid] = lec; persist(pid);
    navigator.vibrate && navigator.vibrate(manual ? 60 : 140);
  } else toast('Este punto ya estaba registrado');
  S.gmap = false; S.sheet = { pid, mode:'conf', warn, auto:!warn && S.view !== 'punto' };
  render(); clearTimeout(S.tm);
  if (S.sheet.auto) S.tm = setTimeout(() => ACT.sheetClose(), 3500);
}
function persist(pid) { saveActive(); DB.set(`${rpath(S.active)}/lecturas/${pid}`, S.active.lecturas[pid]).catch(() => {}); }
function finishRondin(mv) {
  const ron = S.active, st = stats(ron);
  ron.fin = Date.now(); ron.estado = st.faltan.length ? 'incompleto' : 'completo';
  if (st.faltan.length && mv && mv.tipo) { ron.motivo = mv; ron.cierre = 'vigilante'; }
  ron.resumen = { done:st.done, total:st.total, hallazgos:st.hall };
  DB.set(rpath(ron), ron).catch(() => {});
  S.lastClosed = ron; S.active = null; saveActive(); S.view = 'closed'; closeModal(); render();
}

/* ---------- NFC (Web NFC en Android; en iPhone la etiqueta abre la URL) ---------- */
function parseTag(txt) {
  try { const u = new URL(txt), p = u.searchParams.get('punto'); if (p) return { pid:p, k:u.searchParams.get('k') || '' }; } catch (e) {}
  return null;
}
async function startNfc() {
  try {
    const rd = new NDEFReader(); await rd.scan();
    rd.onreading = e => {
      for (const rec of e.message.records) {
        let txt = ''; try { txt = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data); } catch (_) {}
        const t = parseTag(txt); if (t) { handleScan(t.pid, t.k); return; }
      }
      toast('Etiqueta no reconocida', 'bad');
    };
    S.nfcOn = true; render(); toast('Lector NFC activo');
  } catch (e) { toast('No se pudo activar el NFC: ' + (e.message || e), 'bad'); }
}

}

/* ---------- Carga de rondines por rango ---------- */
async function loadRange(a, b, force) {
  const t = dstr(), ds = daysBetween(a, b).filter(d => force || d === t || !S.rond[d]);
  await Promise.all(ds.map(async d => { S.rond[d] = (await DB.get('/rondines/' + d)) || {}; }));
}
const inRange = (a, b) => daysBetween(a, b).flatMap(d => Object.values(S.rond[d] || {}));
async function supLoad(force) {
  S.view = 'sup'; render();
  const f = S.f; let n = daysBetween(f.desde, f.hasta).length;
  if (n > 31) { f.desde = addDays(f.hasta, -30); n = 31; toast('Máximo 31 días por consulta'); }
  try { await loadRange(addDays(f.desde, -n), f.hasta, force); } catch (e) { toast('No se pudieron cargar los rondines', 'bad'); }
  render();
}

/* ---------- Supervisión ---------- */
function programados(a, b) {
  const all = inRange(addDays(a, -1), addDays(b, 1)); if (!all.length) return [];
  const first = all.reduce((m, r) => r.fecha < m ? r.fecha : m, '9999'), now = Date.now(), out = [];
  daysBetween(a, b).forEach(d => {
    if (d < first) return;
    Object.values(S.rutas).forEach(r => {
      if (!diasOf(r).includes(new Date(d + 'T12:00:00').getDay())) return;
      hors(r).forEach(h => {
        const [H, M] = h.split(':').map(Number), t = new Date(d + 'T00:00:00'); t.setHours(H, M, 0, 0);
        if (t.getTime() + 60 * 6e4 > now) return;
        out.push({ fecha:d, ruta:r.nombre, h, hecho:all.some(x => x.rutaId === r.id && Math.abs(x.inicio - t.getTime()) <= 60 * 6e4) });
      });
    });
  });
  return out;
}
function metrics(a, b) {
  const list = inRange(a, b), n = list.length;
  return { n, pct:n ? Math.round(list.reduce((s, r) => s + stats(r).pct, 0) / n) : 0, hall:list.reduce((s, r) => s + stats(r).hall, 0),
    inc:list.filter(r => r.estado === 'incompleto').length, omit:programados(a, b).filter(x => !x.hecho).length };
}
function kpi(label, prev, cur, goodUp, unit = '') {
  const d = cur - prev, good = d === 0 ? null : (d > 0) === goodUp, cls = good == null ? 'neu' : good ? 'pos' : 'neg';
  return `<div class="kpi"><div class="kl">${label}</div><div class="kv">${cur}${unit}</div><div class="kd ${cls}">${prev}${unit} → ${cur}${unit} · ${d > 0 ? '+' : ''}${d}${unit}</div></div>`;
}

}

function filtered() {

}

      Object.assign(r, { estado:'incompleto', fin:sc.length ? sc[sc.length - 1][1].ts : r.inicio, motivo:mv, cierre:'supervisor', cerradoPor:S.user.nombre, cerradoEn:Date.now(), resumen:{ done:st.done, total:st.total, hallazgos:st.hall } });
      try { await DB.update(`/rondines/${r.fecha}/${r.id}`, { estado:r.estado, fin:r.fin, motivo:mv, cierre:r.cierre, cerradoPor:r.cerradoPor, cerradoEn:r.cerradoEn, resumen:r.resumen }); } catch (e) { toast('No se pudo guardar el cierre', 'bad'); return; }
      closeModal(); toast('Rondín cerrado como incompleto'); if (S.tab === 'monitor') refreshMonitor(); else render();
    };
  },
  /* plano y monitor */
  gmap() { S.gmap = true; render(); },
  gmapClose() { S.gmap = false; render(); },
  monSel(t) { if (!t.dataset.id) return; S.mon.sel = t.dataset.id; S.mon.upto = null; clearInterval(S.mon.timer); S.mon.timer = null; S.mon.fit = true; refreshMonitor(); },
  async monMode(t) {
    S.mon.mode = t.dataset.m; S.mon.upto = null; S.mon.fit = true; clearInterval(S.mon.timer); S.mon.timer = null;
    if (S.mon.mode === 'periodo') { try { await loadRange(S.f.desde, S.f.hasta); } catch (e) {} }
    render();
  },
  monAreas(t) { S.mon.areas = !S.mon.areas; t.textContent = (S.mon.areas ? 'Ocultar' : 'Mostrar') + ' áreas'; drawAreas(); },
  monPl(t) { S.mon.place = t.dataset.id; $('#monBody').innerHTML = monUbicar(); refreshMonitor(); },
  async monQuitar() {
    const id = S.mon.place; if (!id || !S.puntos[id].pos) { toast('Ese punto no tiene ubicación'); return; }
    delete S.puntos[id].pos; await DB.remove(`/puntos/${id}/pos`); $('#monBody').innerHTML = monUbicar(); refreshMonitor(); toast('Ubicación quitada: ' + id);
  },
  rpPlay() {
    const M = S.mon; if (M.timer) { clearInterval(M.timer); M.timer = null; refreshMonitor(); return; }
    const ron = currentRon(); if (!ron) return; const n = scansOf(ron).length; if (!n) return;
    if (M.upto == null || M.upto >= n) M.upto = 0;
    M.timer = setInterval(() => { M.upto++; if (M.upto >= n) { M.upto = null; clearInterval(M.timer); M.timer = null; } refreshMonitor(); }, 700);
    refreshMonitor();
  },
  rpLive() { clearInterval(S.mon.timer); S.mon.timer = null; S.mon.upto = null; refreshMonitor(); },
  verPlano(t) { const r = findR(t.dataset.f, t.dataset.id); if (!r) return; Object.assign(S.mon, { sel:r.id, mode:'vivo', upto:null, fit:true }); S.tab = 'monitor'; closeModal(); render(); },
  /* supervisión */
  tab(t) { S.tab = t.dataset.k; render(); },
  ctab(t) { S.ctab = t.dataset.k; render(); },
  apply() {
    const f = S.f; f.desde = $('#fd').value || f.desde; f.hasta = $('#fh').value || f.hasta;
    if (f.desde > f.hasta) { toast('La fecha inicial debe ser anterior a la final', 'bad'); return; }
    if ($('#fr')) f.ruta = $('#fr').value; if ($('#fv')) f.vig = $('#fv').value; if ($('#fe')) f.estado = $('#fe').value;
    if ($('#ft')) f.tipo = $('#ft').value; if ($('#fa')) f.aten = $('#fa').value;
    supLoad();
  },
  refresh() { ACT.apply(); supLoad(true); },
  export() { exportXlsx(); }, print() { window.print(); },
  async atender(t) {
    const nota = await askText('Nota de atención', 'Qué se hizo para atender el hallazgo'); if (!nota) return;
    const r = findR(t.dataset.f, t.dataset.id), p = t.dataset.p, v = { por:S.user.nombre, ts:Date.now(), nota };
    await DB.set(`/rondines/${r.fecha}/${r.id}/lecturas/${p}/atendido`, v); r.lecturas[p].atendido = v; render(); toast('Marcado como atendido');
  },
  /* puntos */
  async pAdd() {
    const ids = Object.keys(S.puntos).map(x => +x.slice(1)), id = pidOf(Math.max(0, ...ids) + 1), nombre = await askText('Nombre del nuevo punto', 'Ej. Acceso E4'); if (!nombre) return;
    S.puntos[id] = { id, nombre, token:rtok() }; await DB.set('/puntos/' + id, S.puntos[id]); render(); toast('Punto agregado: ' + id);
  },
  async pDel(t) {
    const id = t.dataset.id; if (!await confirmBox(`¿Eliminar «${S.puntos[id].nombre}»? También se quitará de las rutas.`, 'Eliminar', true)) return;
    delete S.puntos[id]; await DB.remove('/puntos/' + id);
    for (const r of Object.values(S.rutas)) { const n = arr(r.puntos).filter(x => x !== id); if (n.length !== arr(r.puntos).length) { r.puntos = n; await DB.set(`/rutas/${r.id}/puntos`, n); } }
    S.draft = null; render();
  },
  pQR(t) {
    const id = t.dataset.id, url = tagUrl(id);
    modal(`<h2>${esc(S.puntos[id].nombre)}</h2><p class="mu sm">${id}</p><div id="qr" style="display:grid;place-items:center;padding:14px"></div><label>URL de la etiqueta</label><input readonly value="${esc(url)}" onclick="this.select()"><div class="row"><button class="btn sec" data-act="closeModal">Cerrar</button></div>`);
    new QRCode($('#qr'), { text:url, width:220, height:220, colorDark:'#0D18A8', colorLight:'#ffffff' });
  },
  async pNFC(t) {
    const id = t.dataset.id, url = tagUrl(id);
    if (!NFC) { modal(`<h2>Grabar etiqueta ${id}</h2><p>Esta función requiere <b>Chrome en Android</b>. Desde iPhone o PC usa una app como NFC Tools y graba un registro de tipo <b>URL</b> con este valor:</p><input readonly value="${esc(url)}" onclick="this.select()"><div class="row"><button class="btn" data-act="closeModal">Cerrar</button></div>`); return; }
    modal(`<h2>${esc(S.puntos[id].nombre)}</h2><p>Acerca la etiqueta NFC a la parte trasera del celular…</p><div class="row"><button class="btn sec" data-act="closeModal">Cancelar</button></div>`);
    try { await new NDEFReader().write({ records:[{ recordType:'url', data:url }] }, { overwrite:true }); closeModal(); toast('Etiqueta grabada: ' + id); }
    catch (e) { closeModal(); toast('No se pudo grabar: ' + (e.message || e), 'bad'); }
  },
  pPrint() {
    const tmp = document.createElement('div'); tmp.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(tmp);
    const items = Object.values(S.puntos).sort(byId).map(p => { const d = document.createElement('div'); tmp.appendChild(d); new QRCode(d, { text:tagUrl(p.id), width:200, height:200, colorDark:'#000000', colorLight:'#ffffff' }); const c = d.querySelector('canvas'); return { p, src:c ? c.toDataURL() : '' }; });
    const w = window.open('', '_blank'); if (!w) { tmp.remove(); toast('Permite las ventanas emergentes para imprimir', 'bad'); return; }
    w.document.write(`<html><head><title>QR de puntos de rondín</title><style>body{font-family:'Segoe UI',Arial,sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.i{border:1px solid #cbd5e1;border-radius:8px;padding:10px;text-align:center;break-inside:avoid;font-size:13px}.i img{width:170px;height:170px}.i b{display:block;margin-top:6px;font-size:16px}</style></head><body><h2>Puntos de rondín — Zubex</h2><div class="g">${items.map(x => `<div class="i"><img src="${x.src}"><b>${x.p.id}</b>${esc(x.p.nombre)}</div>`).join('')}</div><script>setTimeout(function(){print()},400)<\/script></body></html>`);
    w.document.close(); tmp.remove();
  },
  /* rutas */
  rSel(t) { readRouteForm(); S.rid = t.dataset.id; S.draft = null; render(); },
  rNew() { readRouteForm(); S.rid = 'R' + uid(); S.draft = { id:S.rid, nombre:'Nueva ruta', turno:'Día', horarios:'09:00', dias:'0,1,2,3,4,5,6', durMin:40, durMax:45, intervalo:2, orden:'avisar', puntos:[], _new:true }; render(); },
  rUp(t) { readRouteForm(); const i = +t.dataset.i, p = S.draft.puntos; if (i > 0) { [p[i - 1], p[i]] = [p[i], p[i - 1]]; } render(); },
  rDown(t) { readRouteForm(); const i = +t.dataset.i, p = S.draft.puntos; if (i < p.length - 1) { [p[i + 1], p[i]] = [p[i], p[i + 1]]; } render(); },
  rRm(t) { readRouteForm(); S.draft.puntos.splice(+t.dataset.i, 1); render(); },
  rAdd() { readRouteForm(); const v = $('#rf-add').value; if (v) S.draft.puntos.push(v); render(); },
  async rSave() {
    readRouteForm(); const d = S.draft;
    if (!d.nombre) { toast('La ruta necesita un nombre', 'bad'); return; }
    if (!d.puntos.length) { toast('Agrega al menos un punto a la secuencia', 'bad'); return; }
    const o = { ...d }; delete o._new; S.rutas[o.id] = o; await DB.set('/rutas/' + o.id, o); S.draft = null; render(); toast('Ruta guardada');
  },
  async rDel() {
    const d = S.draft; if (!await confirmBox(`¿Eliminar la ruta «${d.nombre}»?`, 'Eliminar', true)) return;
    delete S.rutas[d.id]; await DB.remove('/rutas/' + d.id); S.rid = null; S.draft = null; render();
  },
  /* usuarios */
  async uAdd() {
    const n = $('#un').value.trim(), nm = $('#uname').value.trim(), pin = $('#up').value.trim();
    if (!/^[A-Za-z0-9_-]+$/.test(n) || !nm || pin.length < 4) { toast('Revisa nómina (letras o números), nombre y PIN de 4+ dígitos', 'bad'); return; }
    if (S.usuarios[n]) { toast('Esa nómina ya existe', 'bad'); return; }
    const u = { nomina:n, nombre:nm, rol:$('#ur').value, pin:await hashPin(pin) }; S.usuarios[n] = u; await DB.set('/usuarios/' + n, u); render(); toast('Usuario agregado');
  },
  async uPin(t) {
    const pin = await askText('Nuevo PIN (mínimo 4 dígitos)', 'PIN', 'Guardar', true); if (!pin) return;
    if (pin.length < 4) { toast('El PIN debe tener al menos 4 dígitos', 'bad'); return; }
    const u = S.usuarios[t.dataset.id]; u.pin = await hashPin(pin); await DB.set(`/usuarios/${u.nomina}/pin`, u.pin); toast('PIN actualizado');
  },
  async uDel(t) {
    if (!await confirmBox(`¿Eliminar al usuario ${t.dataset.id}?`, 'Eliminar', true)) return;
    delete S.usuarios[t.dataset.id]; await DB.remove('/usuarios/' + t.dataset.id); render();
  },
  async resetLocal() { if (await confirmBox('Se borrarán todos los datos de prueba de este navegador.', 'Restablecer', true)) { localStorage.removeItem('rz_localdb'); localStorage.removeItem('rz_active'); localStorage.removeItem('rz_ses'); location.reload(); } }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.stop[data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', async e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (b === 'pname') { const v = t.value.trim(); if (!v) { t.value = S.puntos[t.dataset.id].nombre; return; } S.puntos[t.dataset.id].nombre = v; await DB.set(`/puntos/${t.dataset.id}/nombre`, v); toast('Nombre guardado'); }
  if (b === 'base') { const v = t.value.trim(); S.cfg.baseUrl = v; await DB.set('/config/baseUrl', v); toast('URL base guardada'); }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'rpSl') return; const M = S.mon, ron = currentRon(); if (!ron) return;
  clearInterval(M.timer); M.timer = null; const v = +e.target.value; M.upto = v >= scansOf(ron).length ? null : v; refreshMonitor();
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.bind === 'monpl') { S.mon.place = t.value; $('#monBody').innerHTML = monUbicar(); refreshMonitor(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.rc2[data-act]')) e.target.click(); });

/* ---------- Inicio ---------- */
(async function init() {
  const q = new URLSearchParams(location.search);
  if (q.get('punto')) { S.pending = { pid:q.get('punto'), k:q.get('k') || '' }; history.replaceState(null, '', location.pathname); }
  render();
  try { await loadBase(); } catch (e) { $('#app').innerHTML = `<div class="wrap"><div class="card"><h2>No se pudo conectar con la base de datos</h2><p class="mu sm" style="margin-top:6px">${esc(e.message || e)}</p></div></div>`; return; }
  const ses = localStorage.getItem('rz_ses');
  if (ses && S.usuarios[ses]) { S.user = S.usuarios[ses]; loadActive(); enterApp(); }
  else { S.view = 'login'; render(); }
})();
</script>
</body>
</html>
